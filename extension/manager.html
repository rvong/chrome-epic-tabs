<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Epic Tabs Manager</title>
  <link rel="stylesheet" href="styles/tailwind.css">
</head>
<body class="bg-gray-50">
  <div class="flex flex-col h-screen">
    <!-- Header -->
    <header class="bg-white border-b border-gray-200 shadow-sm">
      <div class="max-w-7xl mx-auto px-6 py-4">
        <div class="flex items-center justify-between">
          <div>
            <h1 class="text-2xl font-bold text-gray-900">Epic Tabs Manager</h1>
            <p class="text-sm text-gray-500 mt-1">Manage and organize your saved tabs</p>
          </div>
          <div class="flex gap-8">
            <div class="text-center">
              <div class="text-3xl font-bold text-primary-500" id="totalTabs">0</div>
              <div class="text-xs text-gray-600 uppercase tracking-wider">Saved Tabs</div>
            </div>
            <div class="text-center">
              <div class="text-3xl font-bold text-primary-500" id="totalSessions">0</div>
              <div class="text-xs text-gray-600 uppercase tracking-wider">Sessions</div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <div class="flex flex-1 overflow-hidden">
      <!-- Sidebar -->
      <aside class="w-60 bg-white border-r border-gray-200 flex flex-col">
        <nav class="flex-1 py-4">
          <button class="nav-item active" data-view="sessions">
            <span class="text-xl">📁</span>
            <span>Sessions</span>
          </button>
          <button class="nav-item" data-view="all-tabs">
            <span class="text-xl">📑</span>
            <span>All Tabs</span>
          </button>
          <button class="nav-item" data-view="search">
            <span class="text-xl">🔍</span>
            <span>Search</span>
          </button>
        </nav>

        <div class="p-4 space-y-2 border-t border-gray-200">
          <button id="exportBtn" class="btn btn-outline w-full text-sm justify-center">
            <span>📤</span>
            <span>Export</span>
          </button>
          <button id="importBtn" class="btn btn-outline w-full text-sm justify-center">
            <span>📥</span>
            <span>Import</span>
          </button>
        </div>
      </aside>

      <!-- Content Area -->
      <main class="flex-1 overflow-y-auto scrollbar-thin">
        <div class="max-w-7xl mx-auto p-6">
          <!-- Search Bar -->
          <div class="mb-6 flex gap-3 max-w-2xl">
            <input
              type="text"
              id="searchInput"
              placeholder="Search tabs by title or URL..."
              class="input flex-1"
            >
            <button id="searchBtn" class="btn btn-primary">
              <span>🔍</span>
              <span>Search</span>
            </button>
          </div>

          <!-- Sessions View -->
          <div id="sessionsView" class="view active">
            <div class="flex items-center justify-between mb-6">
              <h2 class="text-xl font-bold text-gray-900">Sessions</h2>
              <button id="newSessionBtn" class="btn btn-primary">
                <span>➕</span>
                <span>New Session</span>
              </button>
            </div>
            <div id="sessionsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              <div class="text-center py-12 text-gray-500">Loading sessions...</div>
            </div>
          </div>

          <!-- All Tabs View -->
          <div id="allTabsView" class="view hidden">
            <div class="flex items-center justify-between mb-6">
              <h2 class="text-xl font-bold text-gray-900">All Saved Tabs</h2>
              <select id="sortBy" class="input text-sm">
                <option value="timestamp-desc">Newest First</option>
                <option value="timestamp-asc">Oldest First</option>
                <option value="title-asc">Title A-Z</option>
                <option value="title-desc">Title Z-A</option>
                <option value="domain-asc">Domain A-Z</option>
              </select>
            </div>
            <div id="allTabsList" class="space-y-2">
              <div class="text-center py-12 text-gray-500">Loading tabs...</div>
            </div>
            <div id="loadMoreContainer" class="mt-6 text-center hidden">
              <button id="loadMoreBtn" class="btn btn-outline">
                Load More Tabs
              </button>
            </div>
          </div>

          <!-- Search View -->
          <div id="searchView" class="view hidden">
            <div class="mb-6">
              <h2 class="text-xl font-bold text-gray-900">Search Results</h2>
            </div>
            <div id="searchResults" class="space-y-2">
              <div class="text-center py-20">
                <div class="text-6xl mb-4">🔍</div>
                <p class="text-gray-500">Enter a search term to find tabs</p>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Session Detail Modal -->
  <div id="sessionModal" class="modal-backdrop hidden">
    <div class="modal-content">
      <div class="flex items-center justify-between p-6 border-b border-gray-200">
        <h3 class="text-xl font-bold text-gray-900" id="sessionTitle">Session</h3>
        <button class="modal-close w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 text-2xl text-gray-500 hover:text-gray-700 transition-colors">
          &times;
        </button>
      </div>
      <div class="p-6 overflow-y-auto scrollbar-thin">
        <div class="flex flex-wrap gap-3 mb-6">
          <button id="restoreSessionBtn" class="btn btn-primary">
            <span>↩️</span>
            <span>Restore All</span>
          </button>
          <button id="restoreSessionNewWindowBtn" class="btn btn-outline">
            <span>🪟</span>
            <span>New Window</span>
          </button>
          <button id="renameSessionBtn" class="btn btn-outline">
            <span>✏️</span>
            <span>Rename</span>
          </button>
          <button id="deleteSessionBtn" class="btn btn-danger">
            <span>🗑️</span>
            <span>Delete</span>
          </button>
        </div>
        <div id="sessionTabsList" class="space-y-2">
        </div>
      </div>
    </div>
  </div>

  <!-- Import File Input (hidden) -->
  <input type="file" id="importFileInput" accept=".json" class="hidden">

  <style>
    .nav-item {
      @apply w-full flex items-center gap-3 px-6 py-3 text-left text-gray-700 hover:bg-gray-50 transition-colors border-l-4 border-transparent;
    }

    .nav-item.active {
      @apply bg-primary-50 text-primary-700 font-medium border-primary-500;
    }

    .view {
      @apply block;
    }

    .view.hidden {
      @apply hidden;
    }

    .modal-backdrop.active {
      @apply flex;
    }
  </style>

  <script src="manager.js"></script>
</body>
</html>
