<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Epic Tabs</title>
  <link rel="stylesheet" href="styles/tailwind.css">
</head>
<body class="w-80 bg-gray-50">
  <div class="p-4">
    <!-- Header -->
    <div class="mb-4">
      <h1 class="text-xl font-bold text-gray-800 mb-1">Epic Tabs</h1>
      <p class="text-xs text-gray-500">Manage your tabs efficiently</p>
    </div>

    <!-- Stats -->
    <div id="stats" class="grid grid-cols-2 gap-3 mb-4">
      <div class="stat-card">
        <div class="stat-value" id="tabCount">-</div>
        <div class="stat-label">Saved Tabs</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="sessionCount">-</div>
        <div class="stat-label">Sessions</div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="space-y-2 mb-4">
      <button id="saveCurrentTab" class="btn btn-primary w-full justify-center">
        <span>💾</span>
        <span>Save Current Tab</span>
      </button>

      <button id="saveWindowTabs" class="btn btn-secondary w-full justify-center">
        <span>🪟</span>
        <span>Save Window Tabs</span>
      </button>

      <button id="saveAllTabs" class="btn btn-secondary w-full justify-center">
        <span>📚</span>
        <span>Save All Tabs</span>
      </button>
    </div>

    <!-- Options -->
    <div class="bg-white rounded-lg p-3 mb-4 border border-gray-200">
      <label class="flex items-center gap-2 cursor-pointer">
        <input
          type="checkbox"
          id="closeAfterSave"
          class="w-4 h-4 text-primary-500 border-gray-300 rounded focus:ring-primary-500 focus:ring-2"
        >
        <span class="text-sm text-gray-700">Close tabs after saving</span>
      </label>
    </div>

    <!-- Divider -->
    <div class="border-t border-gray-200 my-4"></div>

    <!-- Manager Button -->
    <button id="openManager" class="btn btn-outline w-full justify-center">
      <span>🗂️</span>
      <span>Open Tab Manager</span>
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
